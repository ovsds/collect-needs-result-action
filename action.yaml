name: "Collect Needs Result"
description: "Collects the results of the jobs in `needs` section of the job"

# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#branding
branding:
  icon: "check-circle"
  color: "green"

inputs:
  needs_json:
    description: "`toJson(needs)` passed directly as input"
    required: true
  cancelled_allowed:
    description: "If `true`, cancelled jobs won't fail the action"
    required: true
    default: "false"
  failure_allowed:
    description: "If `true`, failed jobs won't fail the action"
    required: true
    default: "false"
  skip_allowed:
    description: "If `true`, skipped jobs won't fail the action"
    required: true
    default: "true"
  success_allowed:
    description: "If `true`, successful jobs won't fail the action"
    required: true
    default: "true"
  fail_on_failure:
    description: "If `true`, the action will fail if total result is failure"
    required: true
    default: "true"

outputs:
  result:
    description: "Total result"
    value: ${{ steps.run.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Run
      id: run
      shell: bash
      env:
        INPUT_NEEDS_JSON: ${{ inputs.needs_json }}
        INPUT_CANCELLED_ALLOWED: ${{ inputs.cancelled_allowed }}
        INPUT_FAILURE_ALLOWED: ${{ inputs.failure_allowed }}
        INPUT_SKIP_ALLOWED: ${{ inputs.skip_allowed }}
        INPUT_SUCCESS_ALLOWED: ${{ inputs.success_allowed }}
        INPUT_FAIL_ON_FAILURE: ${{ inputs.fail_on_failure }}
      run: |
        # Collect Needs Result
        ${{ github.action_path }}/src/main.sh
